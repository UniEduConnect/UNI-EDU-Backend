services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${PGTZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Các script trong postgres-init chạy theo thứ tự alphabet khi volume còn trống:
      #   01-schema.sql     -> tạo toàn bộ bảng (sinh từ EF migrations)
      #   02-mock-data.sql  -> nạp dữ liệu mẫu
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Init scripts chạy trên server tạm (local socket); pg_isready qua TCP chỉ
      # thành công SAU khi 01-schema.sql + 02-mock-data.sql hoàn tất -> api chờ được.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      uni-edu-net:

  api:
    build: .
    container_name: uni-edu-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres        # tên service, không phải localhost
      POSTGRES_PORT: 5432
      PGTZ: ${PGTZ}
      JWT_SecretKey: ${JWT_SecretKey} # override qua env var
    ports:
      - "8080:8080"
    networks:
      uni-edu-net:

networks:
  uni-edu-net:
    driver: bridge

volumes:
  postgres-data:
