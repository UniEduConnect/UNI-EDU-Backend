services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${PGTZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      uni-edu-net:

  api:
    build: .
    container_name: uni-edu-api
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres        # tên service, không phải localhost
      POSTGRES_PORT: 5432
      PGTZ: ${PGTZ}
      JWT_SecretKey: ${JWT_SecretKey} # override qua env var
    ports:
      - "8080:8080"
    networks:
      uni-edu-net:

networks:
  uni-edu-net:
    driver: bridge

volumes:
  postgres-data:
